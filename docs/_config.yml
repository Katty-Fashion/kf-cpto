# KF Team — GitHub Pages Configuration
# Jekyll config for Git-Native Project Management Dashboard

title: KF Team Dashboard
description: Single Pane of Glass · GitHub Native · Google Workspace Integration
baseurl: "/kf-cpto"
url: "https://katty-fashion.github.io"

# Project repos are discovered dynamically via scripts/discover.py.
# `tracked_repos` is a curated allowlist: when set (non-empty), discover.py
# includes ONLY these repos (those that also have a kanban.md). This keeps
# the dashboard scoped to the active migration set and excludes test,
# template, archived, and unrelated org repos. Leave empty/remove to fall
# back to "every org repo with a kanban.md".
tracked_repos:
  - kf-be-platform
  - kf-fe-platform
  - kf-platform
  - R3-AAS
  - ai-rise-options
  - tech_brainstorming

# Build settings
markdown: kramdown

# Plugins (only GitHub Pages supported plugins)
plugins:
- jekyll-feed
- jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
- scope:
    path: ""
    type: "pages"
  values:
    layout: "default"
- scope:
    path: "_projects"
    type: "projects"
  values:
    layout: "default"

# Exclude from build
exclude:
- scripts/
- repos/
- "*.py"
- Gemfile
- Gemfile.lock
- README.md
- kf-cpto.md
- okf/
