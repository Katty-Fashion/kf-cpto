name: KF Unified Sync

on:
  push:
    branches: [master]
  repository_dispatch:
    types: [kanban-updated]
  schedule:
    - cron: '0 4 * * 1'    # Luni 04:00 UTC — refresh săptămânal
  workflow_dispatch:

# Serialize runs: multiple repos dispatching at once previously raced on the
# "Commit unified docs" push (non-fast-forward "cannot lock ref" failures).
# Queue runs instead of cancelling — an in-progress Pages deploy must finish.
concurrency:
  group: kf-unified-sync
  cancel-in-progress: false

env:
  KF_ORG: katty-fashion

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      issues: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.KF_PAT }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml requests google-auth google-api-python-client

      - name: Discover repos with kanban.md
        run: python scripts/discover.py
        env:
          KF_PAT: ${{ secrets.KF_PAT }}

      - name: Clone discovered repos
        run: |
          mkdir -p repos
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            repo="${line%%:*}"
            branch="${line#*:}"
            [ "$branch" = "$repo" ] && branch="master"
            echo "Cloning $repo (branch: $branch)..."
            git clone --depth=1 -b "$branch" \
              https://${{ secrets.KF_PAT }}@github.com/${{ env.KF_ORG }}/${repo}.git \
              repos/${repo} || echo "Warning: Failed to clone ${repo}"
          done < repos/discovered.txt

      - name: Validate auto-blocks in augmented Jekyll pages
        run: python scripts/validate_auto_blocks.py

      - name: Aggregate Kanbans + Calendar
        run: python scripts/aggregator.py

      - name: Validate Mermaid diagram syntax
        run: python scripts/validate_mermaid.py

      - name: Validate OKF bundle (non-blocking)
        # OKF is a secondary, additive artifact. Surface conformance issues in
        # the log without ever blocking the canonical Pages deploy.
        continue-on-error: true
        run: python scripts/validate_okf.py

      - name: Commit unified docs
        run: |
          git config user.name "KF Bot"
          git config user.email "bot@katty-fashion.dev"
          git add docs/ || true
          if git diff --staged --quiet; then
            echo "No doc changes to commit."
          else
            git commit -m "chore: auto-update unified docs [skip ci]"
            # Concurrent runs (multiple repo dispatches in one batch) each
            # regenerate docs/ and race on the push. A plain rebase conflicts on
            # the regenerated files (loe.yml/boards.yml/gantt.yml differ by
            # timestamp). Retry with a rebase that PREFERS this run's fresh
            # output (-X theirs = the replayed commit during a rebase), so the
            # latest run wins deterministically instead of failing the job.
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -gt 5 ]; then
                echo "::error::push failed after $n attempts"; exit 1
              fi
              echo "push rejected — rebasing onto latest (attempt $n)"
              git fetch origin master
              git rebase -X theirs origin/master || git rebase --abort
              sleep $(( (RANDOM % 5) + 2 ))
            done
          fi

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

      # Sheets export is a downstream consumer — runs AFTER Pages is live.
      # A failure here never blanks the team's canonical dashboard.
      # The script exits 0 even on failure (it files a sync-failure issue
      # and records the failure in docs/_data/sync_status.yml).
      - name: Sync LOE to Google Sheets (downstream export)
        run: python scripts/sheets_sync.py
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GSHEET_SUMMARY_ID: ${{ secrets.GSHEET_SUMMARY_ID }}
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.KF_PAT }}
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

      - name: Persist sheets sync status
        if: always()
        run: |
          set +e   # status persistence must never fail the run post-deploy
          git add docs/_data/sync_status.yml 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sheets sync status [skip ci]"
            # Same concurrent-push hardening as "Commit unified docs", but kept
            # non-fatal (trailing || true) — a status push race must never fail
            # the run after Pages already deployed.
            n=0
            until git push; do
              n=$((n+1))
              [ "$n" -gt 5 ] && { echo "sheets-status push gave up after $n attempts"; break; }
              git fetch origin master
              git rebase -X theirs origin/master || git rebase --abort
              sleep $(( (RANDOM % 5) + 2 ))
            done || true
          fi

      - name: Build summary
        id: summary
        run: |
          PROJ_COUNT=$(wc -l < repos/discovered.txt | tr -d ' ')
          TASK_COUNT=$(grep -c '|' docs/_projects/*.md 2>/dev/null | tail -1 | cut -d: -f2 || echo 0)
          TRIGGER="${{ github.event.client_payload.project || github.event_name }}"
          echo "text=🚀 *KF Dashboard Updated*\nProjects: ${PROJ_COUNT} | Trigger: ${TRIGGER}\nKanban + Calendar refreshed\nLOE synced to Google Sheets\n🔗 https://katty-fashion.github.io/kf-cpto/" >> "$GITHUB_OUTPUT"

      - name: Notify Google Chat
        run: |
          curl -s -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
          -H 'Content-Type: application/json' \
          -d "{\"text\": \"${{ steps.summary.outputs.text }}\"}"
